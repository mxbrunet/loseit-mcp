# Builds the container image and deploys it to Cloudflare Workers + Containers.
#
# The build runs here rather than on a developer machine because Cloudflare
# runs linux/amd64: an Apple Silicon laptop would have to emulate it, while
# ubuntu-latest builds it natively.
name: Deploy to Cloudflare

on:
  push:
    branches: [cloudflare]
    # Documentation and tests don't change what gets deployed.
    paths-ignore:
      - "**.md"
      - "tests/**"
  workflow_dispatch:

# A deploy is a rollout, not something to run twice at once. Don't cancel one
# in progress — a half-finished container rollout is worse than a queued one.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install wrangler
        working-directory: cloudflare
        run: npm ci

      # Catches a broken worker/index.ts before it reaches a rollout.
      - name: Typecheck the Worker
        working-directory: cloudflare
        run: |
          npx wrangler types
          npx tsc --noEmit

      # Stamps the image so /healthz names the exact commit that is running.
      # These are Docker build args, so they go through image_vars in the
      # config rather than through a deploy flag.
      - name: Stamp the build
        working-directory: cloudflare
        run: |
          sed -i "s|\"BUILD_COMMIT\": \"unknown\"|\"BUILD_COMMIT\": \"${GITHUB_SHA}\"|" wrangler.jsonc
          sed -i "s|\"BUILD_TIME\": \"unknown\"|\"BUILD_TIME\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"|" wrangler.jsonc
          grep -A4 image_vars wrangler.jsonc

      - name: Deploy
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Container deploys roll out gradually: the previous instance keeps
      # serving until it cycles, so a 200 from /healthz proves only that
      # something is up. Wait for the commit this run built to be the one
      # actually answering.
      - name: Verify the new build is serving
        run: |
          for i in $(seq 1 40); do
            commit=$(curl -sf --max-time 20 https://loseit-mcp.mbrunet.com/healthz \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['build']['commit'])" 2>/dev/null || true)
            if [ "$commit" = "${GITHUB_SHA}" ]; then
              echo "serving ${GITHUB_SHA}"
              exit 0
            fi
            echo "waiting for rollout (currently: ${commit:-no response})"
            sleep 15
          done
          echo "::error::${GITHUB_SHA} was not serving within 10 minutes"
          exit 1
